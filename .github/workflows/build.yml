name: Build Mo.F Catalog APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract project
        run: unzip -q MoF-Catalog-Android-Project.zip -d extracted

      - name: Build APK
        run: |
          cd extracted/MoFCatalog
          gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MoF-Catalog-APK
          path: extracted/MoFCatalog/app/build/outputs/apk/debug/app-debug.apk
